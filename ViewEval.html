  <script>
 function openProp(evt, prop) {
  // Declare all variables
  var i;
  var tabcontent
  var tablinks;

  // Get all elements with class="tabcontent" and hide them
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }

  // Get all elements with class="tablinks" and remove the class "active"
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }

  // Show the current tab, and add an "active" class to the button that opened the tab
  document.getElementById(prop).style.display = "block";
  evt.currentTarget.className += " active";
     
    }
    
    
  function saveData() {
   var x = document.getElementById("staff-eval");
   var array = [];
   var i;
   var j = 0;
   
   if (x.elements["evalStatus"].value != "Finalized") {
   
   for (i = 1; i < x.length; i++) {
   if (x[i].checked == true || x[i].type == "text" || x[i].type == "textarea" || x[i].type == "date" || x[i].type == "time") {
    array[j] = x.elements[i].value;
    j++;
    }
   }
  
   google.script.run.postData(array);
   
   }//end of not finalized
  
  }
  
 //-------------------------------------------------------
 
 function releaseData() {
 
  var release = confirm('Are you sure you wish to release this observation to ' + $( '#name' ).val());
  
  if (release) {
   var x = document.getElementById("staff-eval");
   var array = [];
   var i;
   var j = 0;
   
   for (i = 1; i < x.length; i++) {
   if (x[i].checked == true || x[i].type == "text" || x[i].type == "textarea" || x[i].type == "date" || x[i].type == "time") {
    array[j] = x.elements[i].value;
    j++;
    }
   }
  
   array[3] = 'Released';
   google.script.run.postData(array);
   
   x.elements["evalStatus"].value = "Released";
   $( '#releaseStaff' ).hide();
   
   //function send info to staff
    google.script.run.emailStaff(array);
   
   //$( '#final' ).show();
   
  } //end if release
 
 }
 
 //-------------------------------------------------------
 
 function Finalize() {
 
 var final = confirm('Are you sure you wish to finalize this observation');
  
  if (final) {

   var x = document.getElementById("staff-eval");
   var array = [];
   var i;
   var j = 0;
   
   for (i = 1; i < x.length; i++) {
   if (x[i].checked == true || x[i].type == "text" || x[i].type == "textarea" || x[i].type == "date" || x[i].type == "time") {
    array[j] = x.elements[i].value;
    j++;
    }
   }
  
   array[3] = 'Finalized';
   
   //google.script.run.postData(array);
   google.script.run.sendFinalized(array);
   
   x.elements["evalStatus"].value = "Finalized";
   $( '#final' ).hide();
   $( '#save' ).hide();
   
   google.script.run.emailStaff(array);
   
   var url = 'https://script.google.com/a/carrabec.org/macros/s/AKfycbyymVo_R4KcaHp29eFC6Jj3XskG2SsBROj-LmPIVbe3BeRSrsNy/exec';

   window.top.location.href = url;
 
   
  } //end if release
 
 }
